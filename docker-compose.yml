services:
  db:
    image: mysql:8.0
    container_name: daily-todo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: daily_todo
      MYSQL_USER: daily
      MYSQL_PASSWORD: daily_dev
    ports:
      - "3307:3306"   # host 3307 -> container 3306 (avoids clashing with a local MySQL on 3306)
    volumes:
      - daily_todo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  daily_todo_mysql:
